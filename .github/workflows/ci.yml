name: Amrutam Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: amrutam_db
          POSTGRES_USER: amrutam_user
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U amrutam_user -d amrutam_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "False"
          DB_NAME: amrutam_db
          DB_USER: amrutam_user
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          python manage.py check

      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "False"
          DB_NAME: amrutam_db
          DB_USER: amrutam_user
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "False"
          DB_NAME: amrutam_db
          DB_USER: amrutam_user
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          python manage.py test

      - name: Validate OpenAPI schema
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "False"
          DB_NAME: amrutam_db
          DB_USER: amrutam_user
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          python manage.py spectacular --file schema.yml --validate